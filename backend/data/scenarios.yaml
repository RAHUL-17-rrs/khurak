  - {id: hi02, lang: hi-IN, voice: Kalpana, answers: {ask_dose: "हाँ, खा ली थी सुबह।", ask_symptoms: "पेशाब थोड़ा लाल आ रहा है बस।"}, expected: {status: GREEN, rule: R7}}
