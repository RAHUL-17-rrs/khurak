# ALL SYNTHETIC. What each fictional patient says. Rendered to audio with Gnani Timbre v3.0
# (patient voices + audio tags like <coughs>), then phone-degraded to 8 kHz mu-law with noise.
#
# `answers` maps the agent's question stage -> what the patient says.
# `expected` is the ground truth the evaluator scores against.

demo_day: 19

demo:
  P1:
    answers:
      ask_dose: "हो, घेतली."
      ask_symptoms: "हो, दोन दिवसांपासून डोळे पिवळे दिसतायत आणि उलटी होतेय."
    expected: {status: RED, rule: R1}
  P2:
    answers:
      ask_dose: "हाँ, ले ली दवा।"
      ask_symptoms: "बस पेशाब का रंग लाल आ रहा है, डर लग रहा है। दवा बंद कर दूँ क्या?"
    expected: {status: GREEN, rule: R7}
  P3:
    answers:
      ask_dose: "Ab main theek hoon, maine dawai band kar di."
      ask_symptoms: "Nahi, koi problem nahi hai."
    expected: {status: AMBER, rule: R3}
  P4:
    no_answer_attempts: 2
    family_answer: "<sigh> ಅಮ್ಮ ಊರಿಗೆ ಹೋಗಿದ್ದಾರೆ, ಮಾತ್ರೆ ತೆಗೆದುಕೊಂಡು ಹೋಗಿಲ್ಲ."
    expected: {status: AMBER, rule: F2}
  P5:
    answers:
      ask_dose: "हाँ ले ली, आँखें पीली नहीं हैं, सब ठीक है।"
      confirm_symptom: "नहीं, पीलापन नहीं है।"
    expected: {status: GREEN, rule: R8}
  P6:
    answers:
      ask_dose: "<coughs> हाँ, दवा ले ली है।"
      ask_symptoms: "<coughs> खांसी में खून आ रहा है, दो दिन से।"
    expected: {status: RED, rule: R1}
  P7:
    answers:
      ask_dose: "হ্যাঁ, খেয়েছি।"
      ask_symptoms: "চোখে কেমন ঝাপসা দেখছি কদিন ধরে, রংগুলো ঠিক বুঝতে পারছি না।"
    expected: {status: RED, rule: R1}
  P8:
    answers:
      ask_dose: "हो, सकाळीच गोळी घेतली."
      ask_symptoms: "नाही, काही त्रास नाही."
    expected: {status: GREEN, rule: R8}

